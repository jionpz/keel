name: CI

# PR only tests the proposed change; main tests the integrated commit.
# Do not run push on every feature branch: it duplicates PR runs for the same SHA.
on:
  pull_request:
  push:
    branches: [main]

# All jobs execute repository-controlled code; they need neither write access nor secrets.
permissions:
  contents: read

# Stop obsolete PR checks, but never cancel the integrated main commit's checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # SQL GRANT, triggers, backup and restore need a real PostgreSQL server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      KEEL_DATABASE_URL: postgres://keel:keel@localhost:5432/keel_test

    steps:
      # Immutable action SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PostgreSQL 16 service must not receive a dump from a newer pg_dump:
      # that previously caused pg_restore: unrecognized "transaction_timeout".
      # Fail early rather than silently relying on the runner's default PATH.
      - name: Select PostgreSQL 16 client
        shell: bash
        run: |
          pg16=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg16/pg_dump" || ! -x "$pg16/pg_restore" ]]; then
            echo "::error::PostgreSQL 16 client missing from ubuntu-24.04 runner"
            exit 1
          fi
          echo "$pg16" >> "$GITHUB_PATH"
          "$pg16/pg_dump" --version
          "$pg16/pg_restore" --version

      # One canonical local/CI command. Includes C1-C4, actual DB tests,
      # TypeScript emit and the compiled CLI smoke check.
      - run: pnpm run check

      # Real-model acceptance deliberately remains a separate release gate:
      # no external model/GitHub credentials or nondeterministic runs in PR CI.
      # See src/acceptance/README.md.

  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: docker version
      - run: pnpm run check:isolation

  package:
    # The only delivery candidate is built after BOTH checks pass for this SHA.
    # PRs validate the same package; only integrated main commits upload it.
    needs: [check, isolation]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rebuild in a clean job, install only declared production dependencies,
      # then launch the compiled CLI. A green typecheck alone is insufficient.
      - run: pnpm run check:package
        env:
          KEEL_CANDIDATE_DIR: ${{ runner.temp }}/keel-candidate

      - name: Upload verified candidate (not a production release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: keel-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/keel-candidate/
          if-no-files-found: error
          retention-days: 14
